    <!-- Meta Pixel Code Bootstrapper -->
    <script>
      (function() {
        // Read Pixel ID from window, localStorage, or URL param (?pixel=...)
        var urlParams = new URLSearchParams(window.location.search);
        var paramPixel = urlParams.get('pixel') || urlParams.get('pixelId') || urlParams.get('meta_pixel');
        if (paramPixel) {
          try { localStorage.setItem('meta_pixel_id', paramPixel); } catch(e) {}
        }
        var activePixelId = window.META_PIXEL_ID || (function() {
          try { return localStorage.getItem('meta_pixel_id'); } catch(e) { return null; }
        })();

        // Define standard Meta Pixel base function
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');

        if (activePixelId) {
          fbq('init', activePixelId);
          fbq('track', 'PageView');
          window._metaPixelActive = true;
        } else {
          window._metaPixelActive = false;
        }
      })();
    </script>
